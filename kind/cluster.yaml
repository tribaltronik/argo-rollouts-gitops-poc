# kind cluster configuration for the Argo CD + Argo Rollouts POC
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: poc-argo-gitops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
